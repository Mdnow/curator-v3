# E9 — синтаксические ошибки (код вообще не запустится)
# Стилистические правила (I001, UP045, BLE001, S110 и т.п.) здесь намеренно не включены —
# это «легаси» проекта, они не говорят о поломке.
[lint]
select = ["F", "E9"]
